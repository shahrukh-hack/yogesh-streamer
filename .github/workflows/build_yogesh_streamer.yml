name: Build Yogesh Streamer APK

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Yogesh Streamer APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Artifacts
        run: |
          mkdir -p output_apks
          # Copy and standardize APK names
          cp app/build/outputs/apk/stable/debug/*.apk output_apks/YogeshStreamer-v4.8.1.apk || true
          cp app/build/outputs/apk/prerelease/debug/*.apk output_apks/YogeshStreamer-PreRelease.apk || true
          cd output_apks
          ls -lah

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YogeshStreamer-APK
          path: output_apks/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v4.8.1
          name: "Yogesh Streamer v4.8.1 Official Release"
          files: output_apks/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
