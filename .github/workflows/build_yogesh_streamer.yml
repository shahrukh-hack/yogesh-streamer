name: Build Yogesh Streamer APK

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Yogesh Streamer APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate and Commit Permanent Keystore if not present
        run: |
          if [ ! -f app/release.jks ]; then
            echo "Generating permanent app/release.jks..."
            keytool -genkeypair -v \
              -keystore app/release.jks \
              -alias yogesh \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass yogesh_streamer_pass \
              -keypass yogesh_streamer_pass \
              -dname "CN=Yogesh, OU=Streamer, O=Yogesh, L=Ahmedabad, S=Gujarat, C=IN"
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f app/release.jks
            git commit -m "ðŸ’Ž Permanently lock in release.jks signing key for seamless OTA updates" || true
            git push origin HEAD:${{ github.ref_name }} || true
          else
            echo "Permanent app/release.jks exists. Reusing identical cryptographic signature."
          fi

      - name: Build APKs
        run: ./gradlew assembleStableRelease --stacktrace

      - name: Prepare APK Artifacts
        run: |
          mkdir -p output_apks
          VERSION_NAME=$(grep 'versionName =' gradle/libs.versions.toml | cut -d '"' -f 2)
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "Building for Version: $VERSION_NAME"
          find app/build/outputs/apk/stable/release/ -name "*.apk" -exec cp {} output_apks/YogeshStreamer-v${VERSION_NAME}.apk \;
          cd output_apks
          ls -lah

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YogeshStreamer-APK
          path: output_apks/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: "Yogesh Streamer v${{ env.VERSION_NAME }} Official Release"
          files: output_apks/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true

